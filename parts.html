<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>PCパーツのニュース | GXCのAIサイト</title>

</head>
<body>
<div id="app" data-page="parts" data-cat="parts">
  <header class="site-header" id="site-header"></header>

      <h1>PCパーツのニュース</h1>

    <div class="toolbar">
      <div class="search">
        <label class="sr-only" for="q">PCパーツの記事を検索</label>
        <input id="q" type="search" placeholder="キーワードで探す(例: GPU)" autocomplete="off">
      </div>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
    <div id="list"></div>

  <footer class="site-footer" id="site-footer"></footer>

<script src="news.js"></script>
